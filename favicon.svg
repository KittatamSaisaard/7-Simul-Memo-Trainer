<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#1e1e2e"/>
  <circle cx="8" cy="8" r="3.2" fill="#2e2e42"/>
  <circle cx="16" cy="8" r="3.2" fill="#2e2e42"/>
  <circle cx="24" cy="8" r="3.2" fill="#2e2e42"/>
  <circle cx="8" cy="16" r="3.2" fill="#2e2e42"/>
  <circle cx="16" cy="16" r="3.2" fill="#2e2e42"/>
  <circle cx="24" cy="16" r="3.2" fill="#2e2e42"/>
  <circle cx="8" cy="24" r="3.2" fill="#2e2e42"/>
  <circle cx="16" cy="24" r="3.2" fill="#2e2e42"/>
  <circle cx="24" cy="24" r="3.2" fill="#2e2e42"/>
  <!-- S shape: top row right, right col down, mid row left, left col down, bot row right, br up -->
  <line x1="8"  y1="8"  x2="10.5" y2="8"    stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="8"  x2="18.5" y2="8"    stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="8"  x2="24"   y2="10.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8"  y1="16" x2="8"    y2="18.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="13.5" y2="16"   stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="16" x2="21.5" y2="16"   stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8"  y1="24" x2="10.5" y2="24"   stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="24" x2="18.5" y2="24"   stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="24"   y2="21.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pin dots between quadrants -->
  <circle cx="12" cy="12" r="1.5" fill="#e53935"/>
  <circle cx="20" cy="12" r="1.5" fill="#e53935"/>
  <circle cx="12" cy="20" r="1.5" fill="#e53935"/>
  <circle cx="20" cy="20" r="1.5" fill="#e53935"/>
</svg>
